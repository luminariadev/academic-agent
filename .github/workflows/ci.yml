name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test & Validate Academic Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate n8n Workflow JSON
        run: |
          python -c "
          import json
          with open('workflows/academic-agent.n8n.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert 'nodes' in data and len(data['nodes']) >= 5
          print('✅ n8n workflow JSON is syntactically valid and well-formed.')
          "

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --tb=short
