name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            bin: academic-agent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            bin: academic-agent.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
            bin: academic-agent
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            bin: academic-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --bin academic-agent --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          cp README.md LICENSE dist/
          tar -C dist -czf "academic-agent-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "${{ matrix.bin }}" README.md LICENSE

      - name: Package Windows archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path "dist/*" -DestinationPath "academic-agent-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: academic-agent-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.ext }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum academic-agent-* > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/academic-agent-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
